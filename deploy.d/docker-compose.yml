# SAR Management production stack. Started by ../deploy - do not run by hand
# on a fresh server until deploy.d/.env exists (see .env.example).
#
# The database is external (e.g. a DigitalOcean Managed Database with the
# PostGIS extension available) and reached via POSTGRES in deploy.d/.env.
name: sar

services:
  api:
    build: ../api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES: ${POSTGRES:?set POSTGRES in deploy.d/.env}
    ports:
      # Only reachable from Caddy on the host; Caddy handles TLS and the public port
      - "127.0.0.1:4999:4999"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4999/api').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migrations run on boot
      start_period: 120s
